spring.application.name=RoQui_ec
app.version=3.0.0
app.cors.allowed-origin=http://localhost:5173
# Encrypted key property for the application, default value is "dieciseisnumeros" if not set in environment variables
key.property=${KEY_PROPERTY:dieciseisnumeros}


# Database configuration
# Uncomment to developer mode
# none, validate, update, create, and create-drop
spring.jpa.hibernate.ddl-auto=validate

# Show SQL statements in console
# true or false
#spring.jpa.show-sql=true

# MariaDB connection properties
spring.datasource.url=jdbc:mariadb://localhost:3306/donpos
spring.datasource.username=donpos
spring.datasource.password=d
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Swagger UI configuration
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.oauth.client-id=task-api-client
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# Enable Swagger UI,set false to disable it in production
springdoc.swagger-ui.enabled=true

# Keycloak configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/roqui-realm

# SRI Web Services URLs
sri.url.ws.developer.reception=https://celcer.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline?wsdl
sri.url.ws.developer.authorization=https://celcer.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline?wsdl

sri.url.ws.production.reception=https://cel.sri.gob.ec/comprobantes-electronicos-ws/RecepcionComprobantesOffline?wsdl
sri.url.ws.production.authorization=https://cel.sri.gob.ec/comprobantes-electronicos-ws/AutorizacionComprobantesOffline?wsdl

# Logging configuration
server.tomcat.accesslog.enabled=true
#logging.level.org.apache.tomcat=DEBUG
#logging.level.org.apache.catalina=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/RoQui.log